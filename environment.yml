name: apex-jupyter-lite
channels:
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - ipycanvas
  - numpy
  - pandas
  - matplotlib
  - geopandas
  - xarray
  - netcdf4
  - h5netcdf
  - folium
  - openeo
  - shapely
  - jupytergis-lite
  - jupytergis-lab
  - jupytergis-core
  - pystac-client
  - contextily
  - rioxarray
  - pip:
      - litegitpuller
      - jupyterlab-open-url-parameter
      - git+https://github.com/ESA-APEx/apex_algorithms.git
